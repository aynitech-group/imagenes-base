# CI del catálogo de bases doradas. Corre en el runner de JERJES (etiqueta
# jerjes) con acceso al Docker del host para construir imágenes.
#
# Tres caminos:
#  - Rama / Merge Request  -> verificar: construye las bases que cambian y les pasa Trivy.
#  - main                  -> publicar: construye y publica a ghcr las bases que cambian, imprime FROM.
#  Solo se reconstruye lo que cambia: la base de vLLM pesa ~23 GB y no debe
#  reconstruirse y subirse cada vez que se toca otra carpeta. Si cambia el propio
#  CI o no hay commit de referencia (rama nueva), se construye todo.
#  - Schedule (medianoche) -> actualizar: si upstream publicó digest nuevo,
#                             reconstruye, publica y documenta (huellas.tsv).
stages: [verificar, publicar]

.docker-base: &docker-base
  tags: [jerjes]
  image: docker:28-cli
  before_script:
    - apk add --no-cache git >/dev/null 2>&1 || true
    - |
      carpetas_a_construir() {
        base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
        todas=$(for df in */*/Dockerfile; do d=$(dirname "$df"); [ "${d%%/*}" = PLANTILLA ] || echo "$d"; done)
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
           || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "$todas"; return; fi
        cambios=$(git diff --name-only "$base" "$CI_COMMIT_SHA")
        if echo "$cambios" | grep -q '^\.gitlab-ci\.yml$'; then echo "$todas"; return; fi
        for d in $todas; do echo "$cambios" | grep -q "^$d/" && echo "$d"; done
        return 0
      }

verificar:
  <<: *docker-base
  stage: verificar
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != "main"
  script:
    - |
      set -e
      carpetas=$(carpetas_a_construir)
      [ -n "$carpetas" ] || echo "Ninguna base cambió: nada que construir."
      for carpeta in $carpetas; do
        tecno=$(echo "$carpeta" | cut -d/ -f1)
        ver=$(echo "$carpeta" | cut -d/ -f2)
        [ "$tecno" = "PLANTILLA" ] && continue
        img="verificacion/$tecno:$ver"
        echo "== Construyendo $carpeta ..."
        docker build -t "$img" "$carpeta"
        echo "== Trivy sobre $img (ALTA/CRITICA):"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:0.58.2 image --scanners vuln --timeout 30m --severity HIGH,CRITICAL \
          --format table "$img" || true
        docker rmi "$img" >/dev/null 2>&1 || true
      done

publicar:
  <<: *docker-base
  stage: publicar
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "$GITHUB_TOKEN" | docker login ghcr.io -u aynitech-group --password-stdin
    - |
      set -e
      carpetas=$(carpetas_a_construir)
      [ -n "$carpetas" ] || echo "Ninguna base cambió: nada que construir."
      for carpeta in $carpetas; do
        tecno=$(echo "$carpeta" | cut -d/ -f1)
        ver=$(echo "$carpeta" | cut -d/ -f2)
        [ "$tecno" = "PLANTILLA" ] && continue
        img="ghcr.io/aynitech-group/dorada:$tecno-$ver"
        echo "== Construyendo y publicando $img ..."
        docker build -t "$img" "$carpeta"
        docker push "$img" | tail -1
        digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$img" | cut -d@ -f2)
        echo ""
        echo ">>> Tu base esta publicada. Usa en tu Dockerfile:"
        echo ">>> FROM ghcr.io/aynitech-group/dorada:$tecno-$ver@$digest"
        echo ""
      done

actualizar-nocturno:
  <<: *docker-base
  stage: publicar
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - sh bin/actualizar-nocturno.sh
